<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset</title><style>body{font-family:sans-serif;background:#0b0b1a;color:#fff;text-align:center;padding:40px}</style></head>
<body><h2>جارٍ مسح الذاكرة المؤقتة القديمة…</h2><p id="m">Clearing old cache…</p>
<script>
(async()=>{
  try{ const regs=await navigator.serviceWorker.getRegistrations(); for(const r of regs) await r.unregister(); }catch(e){}
  try{ for(const k of await caches.keys()) await caches.delete(k); }catch(e){}
  try{ sessionStorage.clear(); }catch(e){}
  document.getElementById('m').textContent='تم ✔ Done — الآن افتح المحاكي / opening emulator…';
  setTimeout(()=>location.replace('./index.html'),1500);
})();
</script></body></html>
